[general]
; Network port for the transfer page (the next free one is used if this is busy)
port = 8080

; Stop the transfer page after this many minutes without any activity
idle_minutes = 15

; Where games live (SD card 1). SD card 2's ROMS folder is shown automatically if it exists.
roms_path = /mnt/mmc/ROMS

; Set to yes if A and B feel backwards
swap_ab = no
